name: Personal Release

on:
  workflow_dispatch:
  push:
    branches:
      - personal

permissions:
  contents: write

jobs:
  release:
    name: Build and release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug APKs
        run: ./gradlew assembleProprietaryDebug
      - name: Collect APK
        run: |
          mkdir -p build/personal-out
          find app/build/ -iname "*.apk" -exec cp "{}" build/personal-out/ \;
          ls -la build/personal-out
      - name: Create release
        run: |
          TAG="v2.7.3-personal-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" build/personal-out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jellyfin Android 2.7.3 proprietary - status bar fix" \
            --notes "Built from jellyfin-android v2.7.3 (personal branch). Changes: the web app now draws behind a transparent status bar so the status bar matches the page color."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
